name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=sha,format=short

      - name: Build and push x86_64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, vps-2]
    environment: production-serv-2
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p /home/skyfly/node
          test -f docker-compose.yml

      - name: Sync deploy files
        run: |
          cp docker-compose.yml /home/skyfly/node/docker-compose.yml

      - name: Debug deploy directory
        run: |
          ls -la /home/skyfly/node
          test -f /home/skyfly/node/docker-compose.yml

      - name: Lowercase image name
        run: |
          echo "APP_IMAGE_NAME_LOWER=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/app" >> $GITHUB_ENV

      - name: Write production .env
        working-directory: /home/skyfly/node
        env:
          HUB_URL: ${{ vars.HUB_URL || 'wss://hub.astrex.skyfly.hackclub.app/ws/node' }}
          NODE_ID: ${{ vars.NODE_ID || 'eu-01' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PUBLIC_IP: ${{ vars.PUBLIC_IP || '85.115.209.161' }}
          NAME_EN: ${{ vars.NAME_EN || 'Germany' }}
          COUNTRY_CODE: ${{ vars.COUNTRY_CODE || 'DE' }}
          COUNTRY_FLAG: ${{ vars.COUNTRY_FLAG || '🇩🇪' }}
          XRAY_GRPC_URL: ${{ vars.XRAY_GRPC_URL }}
          XRAY_PORT: ${{ vars.XRAY_PORT || '443' }}
          XRAY_SNI: ${{ vars.XRAY_SNI || 'www.yahoo.com' }}
          XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY || vars.XRAY_PUBLIC_KEY }}
          XRAY_SHORT_ID: ${{ secrets.XRAY_SHORT_ID || vars.XRAY_SHORT_ID }}
          HYSTERIA_API_URL: ${{ vars.HYSTERIA_API_URL || 'http://127.0.0.1:10086' }}
          HYSTERIA_AUTH_ADDR: ${{ vars.HYSTERIA_AUTH_ADDR || '127.0.0.1:8080' }}
          HYSTERIA_PORT: ${{ vars.HYSTERIA_PORT || '443' }}
          HYSTERIA_SNI: ${{ vars.HYSTERIA_SNI || 'fuckbook.pro' }}
          INBOUND_TAGS: ${{ vars.INBOUND_TAGS }}
          APP_IMAGE_NAME: ${{ env.APP_IMAGE_NAME_LOWER }}
          RUST_LOG: ${{ vars.RUST_LOG || 'info,sqlx=debug,tower_http=info,axum::rejection=trace,opentelemetry=info' }}
        run: |
          # Verification of Required Secrets
          : "${AUTH_SECRET:?AUTH_SECRET secret is required}"

          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"

          # Writing to a file
          cat > .env <<EOF
          APP_IMAGE_NAME=${APP_IMAGE_NAME}
          APP_IMAGE_TAG=sha-${SHORT_SHA}

          HUB_URL=${HUB_URL}
          NODE_ID=${NODE_ID}
          AUTH_SECRET=${AUTH_SECRET}
          PUBLIC_IP=${PUBLIC_IP}
          NAME_EN=${NAME_EN}
          COUNTRY_CODE=${COUNTRY_CODE}
          COUNTRY_FLAG=${COUNTRY_FLAG}
          XRAY_GRPC_URL=${XRAY_GRPC_URL:-http://127.0.0.1:10085}
          XRAY_PORT=${XRAY_PORT}
          XRAY_SNI=${XRAY_SNI}
          XRAY_PUBLIC_KEY=${XRAY_PUBLIC_KEY}
          XRAY_SHORT_ID=${XRAY_SHORT_ID}
          HYSTERIA_API_URL=${HYSTERIA_API_URL}
          HYSTERIA_AUTH_ADDR=${HYSTERIA_AUTH_ADDR}
          HYSTERIA_PORT=${HYSTERIA_PORT}
          HYSTERIA_SNI=${HYSTERIA_SNI}
          INBOUND_TAGS=${INBOUND_TAGS:-vless-reality-in}
          RUST_LOG=${RUST_LOG}
          EOF

          chmod 600 .env

      - name: Login to GHCR with GITHUB_TOKEN
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull new image
        run: docker compose -f /home/skyfly/node/docker-compose.yml pull

      - name: Restart app
        run: docker compose -f /home/skyfly/node/docker-compose.yml up -d
